# Builds, signs and notarizes the app on the maintainer's Mac, then publishes it as a
# GitHub Release.
#
#   Push a tag like v1.2  -> release BetterRemoteDisplay 1.2
#   Run manually          -> build and sign only, to check the runner still works
#
# Needs a self-hosted runner labelled `brd-release` with the Developer ID certificate in its
# keychain, and a repository variable NOTARY_PROFILE naming a `notarytool` keychain profile.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# This workflow runs on a personal machine. It must never be triggered by pull requests.
permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: [self-hosted, macOS, brd-release]
    steps:
      - uses: actions/checkout@v4

      - name: Build and sign
        if: github.event_name == 'workflow_dispatch'
        run: ./build.sh

      - name: Build, sign and notarize
        if: github.event_name == 'push'
        env:
          NOTARY_PROFILE: ${{ vars.NOTARY_PROFILE }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [[ -z "$NOTARY_PROFILE" ]]; then
            echo "::error::Repository variable NOTARY_PROFILE is not set; refusing to release an app Gatekeeper would block."
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}" ./build.sh dist
          spctl --assess --type execute --verbose build/BetterRemoteDisplay.app

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/BetterRemoteDisplay.zip \
            --title "BetterRemoteDisplay ${GITHUB_REF_NAME#v}" --generate-notes
